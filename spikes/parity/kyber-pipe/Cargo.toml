[package]
name = "kyber-pipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
# Links Kyber (LicenseRef-Kyber-Commercial OR AGPL-3.0-or-later). See README.
license = "AGPL-3.0-or-later"
description = "Spike S2: Annex-B HEVC stdin -> Kyber (KyProto UnreliableFec over QUIC) -> Annex-B stdout"

# Standalone package: never part of a workspace.
[workspace]

[[bin]]
name = "kyber-send"
path = "src/bin/kyber-send.rs"

[[bin]]
name = "kyber-recv"
path = "src/bin/kyber-recv.rs"

# S5: the per-machine helper the addon spawns (all lanes on one connection).
[[bin]]
name = "qcb-helper"
path = "src/bin/qcb-helper.rs"

[dependencies]
# Kyber crates, pinned to the plank-kymux commit Plank 20ee198 uses.
kynet = { git = "https://github.com/instinctual/plank-kymux", rev = "912ece5c64787997f978673ca60d313898a3548c", features = ["kynet-quinn"] }
kyproto = { git = "https://github.com/instinctual/plank-kymux", rev = "912ece5c64787997f978673ca60d313898a3548c" }
kymux-types = { git = "https://github.com/instinctual/plank-kymux", rev = "912ece5c64787997f978673ca60d313898a3548c" }

# Only for the congestion Controller trait; resolved to the patched copy below.
quinn-proto = { version = "=0.11.17", default-features = false }

anyhow = "1.0"
bytes = "1.10"
hex = "0.4"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
serde_json = "1"
rustls = { version = "0.23.31", default-features = false, features = ["logging", "std", "tls12"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }

[patch.crates-io]
# Plank's quinn-proto 0.11.17 with the DATAGRAM send-buffer accounting fix,
# copied verbatim from plank@20ee198 third_party/quinn-proto-0.11.17 (see
# README.md "Patched quinn-proto" for why this is vendored, not a git dep).
quinn-proto = { path = "vendor/quinn-proto-0.11.17" }

[profile.release]
debug = 1
